<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeFacto Cafe — واجهة المطبخ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f2f2;
    --surface: #ffffff;
    --text: #201f1d;
    --muted: #7d7979;
    --divider: rgba(32,31,29,.16);
    --accent: #c0392b;
    --accent-dark: #96281d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Tajawal", Tahoma, Arial, sans-serif;
    min-height: 100vh;
  }
  button { font: inherit; cursor: pointer; }
  input { font: inherit; }
  [hidden] { display: none !important; }

  /* ── شاشة الدخول (نفس نمط لوحة التحكم) ── */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-card {
    width: 100%; max-width: 360px; background: var(--surface);
    border: 1px solid var(--divider); border-radius: 12px;
    box-shadow: 0 8px 28px rgba(32,31,29,.08);
    padding: 32px 28px; display: flex; flex-direction: column; align-items: center; gap: 22px;
  }
  .login-card img { height: 52px; width: auto; }
  .login-title { font-size: 15px; font-weight: 700; margin: 0; }
  .field { width: 100%; display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; color: var(--muted); }
  .field input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--divider); border-radius: 8px;
    background: var(--bg); color: var(--text);
  }
  .field input:focus { outline: none; border-color: var(--accent); }
  .btn { padding: 11px 20px; border-radius: 8px; border: 0; font-weight: 700; font-size: 14px; }
  .btn-primary { background: var(--accent); color: #fff; width: 100%; }
  .btn-primary:hover { background: var(--accent-dark); }
  .error-msg { color: var(--accent); font-size: 12.5px; text-align: center; min-height: 16px; }

  /* ── شاشة المطبخ ── */
  .kitchen { display: none; }
  .kitchen.visible { display: block; }
  .topbar {
    position: sticky; top: 0; z-index: 5; background: var(--surface);
    border-bottom: 1px solid var(--divider);
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; gap: 16px; flex-wrap: wrap;
  }
  .topbar-left { display: flex; align-items: center; gap: 14px; }
  .topbar img { height: 34px; width: auto; }
  .topbar-title { font-size: 15px; font-weight: 800; }
  .pending-count {
    font-size: 12.5px; font-weight: 700; background: var(--accent); color: #fff;
    padding: 4px 12px; border-radius: 999px;
  }
  .topbar-actions { display: flex; align-items: center; gap: 10px; }
  .btn-ghost { background: transparent; border: 1px solid var(--divider); color: var(--text); border-radius: 8px; padding: 8px 16px; font-size: 13px; }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .sound-toggle { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); cursor: pointer; }

  .board {
    max-width: 1200px; margin: 0 auto; padding: 24px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px;
  }
  .empty-note { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 15px; padding: 80px 20px; }

  .ticket {
    background: var(--surface); border: 1px solid var(--divider); border-radius: 12px;
    padding: 18px; display: flex; flex-direction: column; gap: 12px;
    box-shadow: 0 2px 8px rgba(32,31,29,.05);
    border-inline-start: 5px solid var(--accent);
  }
  .ticket.is-new { animation: pulse 1.4s ease-in-out 2; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 2px 8px rgba(32,31,29,.05); }
    50% { box-shadow: 0 0 0 6px rgba(192,57,43,.18); }
  }
  /* ── تلوين حسب عمر الطلب: كل ما طال الانتظار، زاد التنبيه ── */
  .ticket-warn { border-inline-start-color: #d68910; }
  .ticket-warn .ticket-time { color: #b7791f; font-weight: 700; }
  .ticket-urgent { border-inline-start-color: var(--accent); animation: urgent-pulse 1.6s ease-in-out infinite; }
  .ticket-urgent .ticket-time { color: var(--accent); font-weight: 700; }
  @keyframes urgent-pulse {
    0%, 100% { box-shadow: 0 2px 8px rgba(32,31,29,.05); }
    50% { box-shadow: 0 0 0 5px rgba(192,57,43,.22); }
  }

  .ticket-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ticket-table { font-size: 30px; font-weight: 800; line-height: 1; }
  .ticket-time { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .ticket-lines { display: flex; flex-direction: column; gap: 10px; }
  .ticket-line { display: flex; flex-direction: column; gap: 5px; padding-bottom: 10px; border-bottom: 1px dashed var(--divider); }
  .ticket-line:last-child { border-bottom: 0; padding-bottom: 0; }
  .ticket-line-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .ticket-item { display: flex; flex-direction: column; gap: 3px; }
  .ticket-item-name { font-size: 18px; font-weight: 700; line-height: 1.3; }
  .ticket-item-sub { font-size: 12px; color: var(--muted); }
  .ticket-size { display: inline-block; align-self: flex-start; font-size: 11.5px; padding: 3px 10px; border-radius: 999px; background: var(--bg); color: var(--text); }
  .ticket-note { font-size: 12px; color: var(--accent-dark); background: #fdf0ee; padding: 4px 10px; border-radius: 6px; align-self: flex-start; }
  .ticket-price { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ticket-line-done {
    flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--accent);
    background: #fff; color: var(--accent); font-weight: 700; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  .ticket-line-done:hover { background: var(--accent); color: #fff; }
  .ticket-line-done:disabled { opacity: .5; }
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <form class="login-card" id="loginForm">
    <img src="logo.png" alt="DeFacto Cafe">
    <p class="login-title">دخول واجهة المطبخ</p>
    <div class="field">
      <label for="passInput">كلمة السر</label>
      <input type="password" id="passInput" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary">دخول</button>
    <div class="error-msg" id="loginError"></div>
  </form>
</div>

<div class="kitchen" id="kitchen">
  <div class="topbar">
    <div class="topbar-left">
      <img src="logo.png" alt="DeFacto Cafe">
      <span class="topbar-title">واجهة المطبخ</span>
      <span class="pending-count" id="pendingCount">0</span>
    </div>
    <div class="topbar-actions">
      <label class="sound-toggle"><input type="checkbox" id="soundToggle" checked> صوت التنبيه</label>
      <button class="btn-ghost" id="logoutBtn">خروج</button>
    </div>
  </div>
  <div class="board" id="board"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   الدخول (نفس كلمة سر لوحة التحكم)
   ══════════════════════════════════════════════════════════════ */
const loginWrap = document.getElementById('loginWrap');
const kitchen = document.getElementById('kitchen');
const loginForm = document.getElementById('loginForm');
const loginError = document.getElementById('loginError');

let adminPassword = sessionStorage.getItem('dc_kitchen_pass') || '';

async function tryLogin(password) {
  loginError.textContent = '';
  try {
    const res = await fetch('api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });
    const data = await res.json();
    if (data.ok) {
      adminPassword = password;
      sessionStorage.setItem('dc_kitchen_pass', password);
      loginWrap.hidden = true;
      kitchen.classList.add('visible');
      startPolling();
    } else {
      loginError.textContent = 'كلمة السر غلط، حاولي مرة تانية.';
    }
  } catch {
    loginError.textContent = 'ما قدرنا نتواصل مع السيرفر. تأكدي إنو server.js شغّال.';
  }
}

loginForm.addEventListener('submit', e => { e.preventDefault(); tryLogin(document.getElementById('passInput').value); });
document.getElementById('logoutBtn').addEventListener('click', () => { sessionStorage.removeItem('dc_kitchen_pass'); location.reload(); });
if (adminPassword) tryLogin(adminPassword);

/* ══════════════════════════════════════════════════════════════
   جلب الطلبات وعرضها كتذاكر — polling كل 4 ثواني
   ══════════════════════════════════════════════════════════════ */
const board = document.getElementById('board');
const pendingCount = document.getElementById('pendingCount');
let knownIds = new Set();
let pollTimer = null;

function beep() {
  if (!document.getElementById('soundToggle').checked) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine'; osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    osc.start(); osc.stop(ctx.currentTime + 0.5);
  } catch {}
}

function timeAgo(ts) {
  const sec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
  if (sec < 60) return 'الآن';
  const min = Math.floor(sec / 60);
  return `منذ ${min} ${min === 1 ? 'دقيقة' : 'دقائق'}`;
}

// كل ما طال انتظار أقدم صنف بالتذكرة، بيصير لون التذكرة أوضح كإنذار
function ageClass(ts) {
  const min = (Date.now() - ts) / 60000;
  if (min >= 10) return 'ticket-urgent';
  if (min >= 5) return 'ticket-warn';
  return '';
}

// تجميع الطلبات الجديدة حسب رقم الطاولة — تذكرة وحدة لكل طاولة بدل ما تتفرق
function groupByTable(orders) {
  const map = new Map();
  for (const o of orders) {
    if (!map.has(o.table)) map.set(o.table, []);
    map.get(o.table).push(o);
  }
  return Array.from(map.entries())
    .map(([table, items]) => ({
      table,
      items: items.sort((a, b) => a.createdAt - b.createdAt),
      oldest: Math.min(...items.map(i => i.createdAt))
    }))
    .sort((a, b) => a.oldest - b.oldest); // الطاولة يلي عندها أقدم طلب أول واحدة (طابور FIFO)
}

async function fetchOrders() {
  try {
    const res = await fetch('api/orders?status=new', { headers: { 'X-Admin-Password': adminPassword } });
    if (res.status === 401) { sessionStorage.removeItem('dc_kitchen_pass'); location.reload(); return; }
    const orders = await res.json();
    renderBoard(orders);
  } catch {
    // تجاهل فشل شبكي مؤقت — رح تعيد المحاولة بالـpoll الجاي
  }
}

function renderBoard(orders) {
  pendingCount.textContent = orders.length;
  if (!orders.length) {
    board.innerHTML = '<div class="empty-note">ما في طلبات جديدة حاليًا ✓</div>';
    knownIds = new Set();
    return;
  }

  const isFirstLoad = knownIds.size === 0 && !board.dataset.loaded;
  const newOnes = orders.filter(o => !knownIds.has(o.id));
  if (newOnes.length && !isFirstLoad) beep();

  board.dataset.loaded = '1';
  knownIds = new Set(orders.map(o => o.id));

  const groups = groupByTable(orders);

  board.innerHTML = groups.map(g => `
    <div class="ticket ${ageClass(g.oldest)} ${g.items.some(o => newOnes.some(n => n.id === o.id)) && !isFirstLoad ? 'is-new' : ''}" data-oldest="${g.oldest}">
      <div class="ticket-head">
        <span class="ticket-table">طاولة ${escapeHtml(g.table)}</span>
        <span class="ticket-time" data-ts="${g.oldest}">${timeAgo(g.oldest)}</span>
      </div>
      <div class="ticket-lines">
        ${g.items.map(o => `
          <div class="ticket-line">
            <div class="ticket-line-row">
              <div class="ticket-item">
                <span class="ticket-item-name">${escapeHtml(o.itemAr)}</span>
                ${o.itemEn ? `<span class="ticket-item-sub">${escapeHtml(o.itemEn)}</span>` : ''}
              </div>
              <button class="ticket-line-done" data-done="${o.id}" title="تم التحضير">✓</button>
            </div>
            ${o.sizeAr || o.sizeLabel ? `<span class="ticket-size">${escapeHtml(o.sizeLabel || o.sizeAr)}</span>` : ''}
            ${o.note ? `<span class="ticket-note">📝 ${escapeHtml(o.note)}</span>` : ''}
            ${o.price ? `<span class="ticket-price">${Number(o.price).toLocaleString('en-US')} ل.س</span>` : ''}
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');

  board.querySelectorAll('[data-done]').forEach(btn => {
    btn.addEventListener('click', () => markDone(btn, btn.getAttribute('data-done')));
  });
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function markDone(btn, id) {
  btn.disabled = true;
  try {
    await fetch(`api/orders/${id}/done`, { method: 'POST', headers: { 'X-Admin-Password': adminPassword } });
    fetchOrders();
  } catch {
    btn.disabled = false;
  }
}

function startPolling() {
  fetchOrders();
  pollTimer = setInterval(fetchOrders, 4000);
  // حدّثي "منذ كم دقيقة" ولون التنبيه كل ٢٠ ثانية بدون طلب جديد من السيرفر
  setInterval(() => {
    document.querySelectorAll('.ticket[data-oldest]').forEach(el => {
      const ts = Number(el.dataset.oldest);
      el.querySelector('[data-ts]').textContent = timeAgo(ts);
      el.classList.remove('ticket-warn', 'ticket-urgent');
      const cls = ageClass(ts);
      if (cls) el.classList.add(cls);
    });
  }, 20000);
}
</script>

</body>
</html>
